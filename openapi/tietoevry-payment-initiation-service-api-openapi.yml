components:
  schemas:
    JsonPostAuthorisationsResponse:
      type: object
      properties:
        psuMessage:
          type: string
        authorisationId:
          type: string
        scaStatus:
          type: string
        _links:
          $ref: '#/components/schemas/JsonLinks'
    JsonDeletePaymentResponse:
      type: object
      properties:
        transactionStatus:
          type: string
        _links:
          $ref: '#/components/schemas/JsonLinks'
    JsonGetPaymentResponse:
      type: object
      required:
      - creditorAddress
      - creditorAccount
      - creditorName
      - debtorAccount
      - instructedAmount
      properties:
        endToEndIdentification:
          type: string
        debtorAccount:
          $ref: '#/components/schemas/JsonAccountReference'
        instructedAmount:
          $ref: '#/components/schemas/JsonAmount'
        creditorName:
          type: string
        creditorAddress:
          $ref: '#/components/schemas/JsonAddress'
        creditorAccount:
          $ref: '#/components/schemas/JsonAccountReference'
        remittanceInformationUnstructured:
          type: string
        transactionStatus:
          type: string
          enum:
          - ACCP
          - ACSC
          - ACSP
          - ACTC
          - ACWC
          - ACWP
          - RCVD
          - PDNG
          - RJCT
          - CANC
          - ACFC
          - PATC
          - PART
        _links:
          $ref: '#/components/schemas/JsonLinks'
    JsonAddress:
      type: object
      required:
      - country
      properties:
        street:
          type: string
        buildingNumber:
          type: string
        city:
          type: string
        postalCode:
          type: string
        country:
          type: string
          description: Two characters as defined by ISO 3166
    JsonPostPaymentResponse:
      type: object
      required:
      - paymentId
      - transactionStatus
      properties:
        psuMessage:
          type: string
        tppMessages:
          type: array
          items:
            $ref: '#/components/schemas/JsonMessage'
        paymentId:
          type: string
          format: uuid
        transactionStatus:
          type: string
          enum:
          - ACCP
          - ACSC
          - ACSP
          - ACTC
          - ACWC
          - ACWP
          - RCVD
          - PDNG
          - RJCT
          - CANC
          - ACFC
          - PATC
          - PART
        transactionFeeIndicator:
          type: boolean
        transactionFees:
