            $ref: "#/definitions/JsonErrorResponse"
definitions:
  JsonErrorResponse:
    type: "object"
    required:
    - "transactionStatus"
    properties:
      psuMessage:
        type: "string"
      tppMessages:
        type: "array"
        items:
          $ref: "#/definitions/JsonMessage"
      transactionStatus:
        $ref: "#/definitions/TransactionStatus"
  JsonGetAccountBalancesResponse:
    type: "object"
    required:
    - "balances"
    properties:
      account:
        $ref: "#/definitions/JsonAccountReference"
      balances:
        type: "array"
        items:
          $ref: "#/definitions/JsonBalance"
  JsonGetAccountResponse:
    type: "object"
    required:
    - "account"
    properties:
      account:
        $ref: "#/definitions/JsonAccountDetails"
  JsonGetAccountTransactionsResponse:
    type: "object"
    properties:
      account:
        $ref: "#/definitions/JsonAccountReference"
      transactions:
        $ref: "#/definitions/JsonAccountReport"
      balances:
        type: "array"
        items:
          $ref: "#/definitions/JsonBalance"
  JsonGetAccountsResponse:
    type: "object"
    required:
    - "accounts"
    properties:
      accounts:
        type: "array"
        items:
          $ref: "#/definitions/JsonAccountDetails"
  JsonGetAuthorisationStatusResponse:
    type: "object"
    properties:
      scaStatus:
        $ref: "#/definitions/ScaStatus"
      authorisationId:
        type: "string"
      _links:
        readOnly: true
        $ref: "#/definitions/JsonLinks"
  JsonGetAuthorisationsResponse:
    type: "object"
    properties:
      authorisationsIds:
        type: "array"
        items:
          type: "string"
  JsonGetConsentResponse:
    type: "object"
    required:
    - "access"
    - "combinedServiceIndicator"
    - "consentStatus"
    - "frequencyPerDay"
    - "recurringIndicator"
    - "validUntil"
    properties:
      access:
        $ref: "#/definitions/JsonAccountAccess"
      recurringIndicator:
        type: "boolean"
        description: "true, if the consent is for recurring access to the account\
          \ data false, if the consent is for one access to the account data"
      validUntil:
        type: "string"
        description: "This parameter is indicates a valid until date for the requested\
          \ consent. The content is date in ISODate Format, e.g. 2017-10-30. For recurring consents validUntil must
            not be farther then 180 days in future."
      frequencyPerDay:
        type: "string"
        description: "This field indicates the requested maximum frequency for an\
          \ access without PSU involvement per day. For a one-off access, this attribute\
          \ is set to \"1\"."
      combinedServiceIndicator:
        type: "boolean"
        example: false
        description: "Unsupported mandatory field. Must be set to false"
      consentStatus:
        $ref: "#/definitions/ConsentStatus"
      _links:
        readOnly: true
        $ref: "#/definitions/JsonLinks"
  JsonGetConsentStatusResponse:
    type: "object"
    properties:
      consentStatus:
        $ref: "#/definitions/ConsentStatus"
  JsonPostAuthorisationsResponse:
    type: "object"
    properties:
      psuMessage:
        type: "string"
      tppMessages:
        type: "array"
        items:
          $ref: "#/definitions/JsonMessage"
      scaStatus:
        $ref: "#/definitions/ScaStatus"
      _links:
        readOnly: true
        $ref: "#/definitions/JsonLinks"
      chosenScaMethod:
        $ref: "#/definitions/OtpChosenScaMethod"
      challengeData:
        $ref: "#/definitions/OtpChallengeData"
  JsonPostConsentsRequest:
    type: "object"
    required:
    - "access"
    - "combinedServiceIndicator"
    - "frequencyPerDay"
    - "recurringIndicator"
    - "validUntil"
    properties:
      access:
        $ref: "#/definitions/JsonAccountAccess"
      recurringIndicator:
        type: "boolean"
        description: "true, if the consent is for recurring access to the account\
          \ data false, if the consent is for one access to the account data"
      validUntil:
        type: "string"
        description: "This parameter is requesting a valid until date for the requested\
          \ consent. The content is the local ASPSP date in ISODate Format, e.g. 2017-10-30. For recurring consents validUntil must
            not be farther then 180 days in future."
      frequencyPerDay:
        type: "string"
        description: "This field indicates the requested maximum frequency for an\
          \ access without PSU involvement per day. For a one-off access, this attribute\
          \ is set to \"1\"."
      combinedServiceIndicator:
        type: "boolean"
        example: false
        description: "Unsupported mandatory field. Must be set to false"
  JsonPostConsentsResponse:
    type: "object"
    properties:
      psuMessage:
        type: "string"
      tppMessages:
        type: "array"
        items:
          $ref: "#/definitions/JsonMessage"
      consentId:
        type: "string"
        format: "uuid"
      consentStatus:
        $ref: "#/definitions/ConsentStatus"
      _links:
        readOnly: true
        $ref: "#/definitions/JsonLinks"
      chosenScaMethod:
        $ref: "#/definitions/OtpChosenScaMethod"
      challengeData:
        $ref: "#/definitions/OtpChallengeData"
  JsonGetAccountTransactionDetailsResponse:
    type: "object"
    properties:
      transactionsDetails:
        $ref: "#/definitions/JsonTransaction"
  JsonAccountAccess:
    type: "object"
    properties:
      accounts:
        type: "array"
        items:
          $ref: "#/definitions/JsonAccountReference"
      balances:
        type: "array"
        items:
          $ref: "#/definitions/JsonAccountReference"
      transactions:
        type: "array"
        items:
          $ref: "#/definitions/JsonAccountReference"
  JsonAccountDetails:
    type: "object"
    required:
    - "currency"
    properties:
      iban:
        type: "string"
      bban:
        type: "string"
      pan:
        type: "string"
      maskedPan:
        type: "string"
      msisdn:
        type: "string"
      currency:
        type: "string"
      resourceId:
        type: "string"
      name:
        type: "string"
      balances:
        type: "array"
        items:
          $ref: "#/definitions/JsonBalance"
      _links:
        $ref: "#/definitions/JsonLinks"
    description: "JsonAccountDetails must contain one of iban,bban,maskedPan,msisdn\
      \ or pan field"
  JsonAccountReference:
    type: "object"
    properties:
      iban:
        type: "string"
      bban:
        type: "string"
      pan:
        type: "string"
      maskedPan:
        type: "string"
      msisdn:
        type: "string"
      currency:
        type: "string"
    description: "Must contain one of iban,bban,maskedPan,msisdn or pan field"
  JsonAccountReport:
    type: "object"
    required:
    - "booked"
    properties:
      booked:
        type: "array"
        items:
          $ref: "#/definitions/JsonTransaction"
      pending:
        type: "array"
        items:
          $ref: "#/definitions/JsonTransaction"
      _links:
        $ref: "#/definitions/JsonLinks"
  JsonAmount:
    type: "object"
    required:
    - "amount"
    - "currency"
    properties:
      currency:
        type: "string"
      amount:
        type: "string"
  JsonBalance:
    type: "object"
    required:
    - "balanceAmount"
    - "balanceType"
    properties:
      balanceAmount:
        $ref: "#/definitions/JsonAmount"
      balanceType:
        $ref: "#/definitions/BalanceType"
      referenceDate:
        type: "string"
      lastChangeDateTime:
        type: "string"
  JsonHref:
    type: "object"
    properties:
      href:
        type: "string"
  JsonLinks:
    type: "object"
    properties:
      scaRedirect:
        $ref: "#/definitions/JsonHref"
      scaOAuth:
        $ref: "#/definitions/JsonHref"
      self:
        $ref: "#/definitions/JsonHref"
      status:
        $ref: "#/definitions/JsonHref"
      account:
        $ref: "#/definitions/JsonHref"
      balances:
        $ref: "#/definitions/JsonHref"
      transactions:
        $ref: "#/definitions/JsonHref"
      transactionDetails:
        $ref: "#/definitions/JsonHref"
      first:
        $ref: "#/definitions/JsonHref"
      next:
        $ref: "#/definitions/JsonHref"
      previous:
        $ref: "#/definitions/JsonHref"
      last:
        $ref: "#/definitions/JsonHref"
      download:
        $ref: "#/definitions/JsonHref"
      updatePsuIdentification:
        $ref: "#/definitions/JsonHref"
      startAuthorisation:
        $ref: "#/definitions/JsonHref"
      scaStatus:
        $ref: "#/definitions/JsonHref"
  JsonMessage:
    type: "object"
    required:
    - "category"
    - "code"
    properties:
      category:
        type: "string"
      code:
        type: "string"
      path:
        type: "string"
      text:
        type: "string"
  JsonTransaction:
    type: "object"
    properties:
      transactionId:
        type: "string"
      debtorName:
        type: "string"
      debtorAccount:
        $ref: "#/definitions/JsonAccountReference"
      creditorName:
        type: "string"
      creditorAccount:
        $ref: "#/definitions/JsonAccountReference"
      transactionAmount:
        $ref: "#/definitions/JsonAmount"
      bookingDate:
        type: "string"
      valueDate:
        type: "string"
      remittanceInformationUnstructured:
        type: "string"
        description: "Reference issued used to establish a link between the payment\
          \ of an invoice and the invoice instance."
      remittanceInformationStructured:
        type: "object"
        required:
        - "reference"
        properties:
          reference:
            type: "string"
          referenceType:
            type: "string"
          referenceIssuer:
            type: "string"
  TransactionStatus:
    type: "string"
    enum:
    - "ACCC"
    - "ACCP"
    - "ACSC"
    - "ACSP"
    - "ACTC"
    - "ACWC"
    - "ACWP"
    - "RCVD"
    - "PDNG"
    - "RJCT"
    - "CANC"
    - "ACFC"
    - "PATC"
    - "PART"
  ScaStatus:
    type: "string"
    enum:
    - "received"
    - "psuIdentified"
    - "psuAuthenticated"
    - "scaMethodSelected"
    - "started"
    - "finalised"
    - "failed"
    - "exempted"
  BalanceType:
    type: "string"
    enum:
    - "closingBooked"
    - "expected"
    - "openingBooked"
    - "interimAvailable"
    - "interimBooked"
    - "forwardAvailable"
    - "nonInvoiced"
  ConsentStatus:
    type: "string"
    enum:
    - "received"
    - "rejected"
    - "valid"
    - "revokedByPsu"
    - "expired"
    - "terminatedByTpp"
  OtpChosenScaMethod:
    type: "object"
    properties:
      authenticationType:
        type: "string"
        enum:
        - "SMS_OTP"
        - "CHIP_OTP"
        - "PHOTO_OTP"
        - "PUSH_OTP"
        - "SMTP_OTP"
      authenticationVersion:
        type: "string"
      authenticationMethodId:
        type: "string"
      name:
        type: "string"
      explanation:
        type: "string"
  OtpChallengeData:
    type: "object"
    properties:
      image:
        type: "string"
      data:
        type: "array"
        items:
          type: "string"
      imageLink:
        type: "string"
      otpMaxLength:
        type: "string"
      otpFormat:
        type: "string"
      additionalInformation:
        type: "string"
