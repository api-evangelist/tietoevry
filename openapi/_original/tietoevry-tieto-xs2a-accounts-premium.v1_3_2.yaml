  /xs2a-premium/v1.3/accounts:
    get:
      tags:
      - "Account information service"
      summary: "Account info: Read Account List"
      description: "Reads a list of bank accounts, with balances where required."
      operationId: "getAccounts"
      parameters:
      - name: "Consent-ID"
        in: "header"
        description: "Shall be contained since “Establish Consent Transaction” was\
          \ performed via this API before."
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "X-Request-ID"
        in: "header"
        description: "ID of the request, unique to the call, as determined by the\
          \ initiating party."
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "PSU-IP-Address"
        in: "header"
        description: "The forwarded IP Address header field consists of the corresponding\
          \ HTTP request IP Address field between PSU and TPP. If PSU presence (currently\
          \ IP address) is provided with recurring consent then recurring consent\
          \ counter is not incremented. Therefore account data can be gathered without\
          \ limits."
        schema:
          type: "string"
      - name: "withBalance"
        in: "query"
        description: "If contained, this function reads the list of accessible payment\
          \ accounts including the booking balance. This call will be rejected if\
          \ the withBalance parameter is used in a case, where the access right on\
          \ balances is not granted in the related consent"
        schema:
          type: "boolean"
      - name: "X-API-Key"
        in: "header"
        description: "Authorisation key that can be acquired in TPP developer portal."
        required: true
        schema:
          type: "string"
      - name: "Authorization"
        in: "header"
        description: "Is contained only, if an OAuth2 based SCA was performed in the\
          \ related consent authorisation."
        schema:
          type: "string"
      - name: "PSU-ID"
        in: "header"
        description: "Client ID of the PSU in the bank."
        schema:
          type: "string"
      - name: "PSU-Corporate-ID"
        in: "header"
        description: "Corporate client ID of the PSU in the bank."
        schema:
          type: "string"
      responses:
        200:
          description: "No errors occurred. Return a list of accounts. Each account's\
            \ _links section is using viewBalances and viewTransactions links."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonGetAccountsResponse"
        400:
          description: "One of mandatory parameters(headers, request body or query\
            \ parameters) missing or in incorrect format"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        401:
          description: "Consent expired; Consent is not valid for requested resource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        403:
          description: "Consent not found; Consent not authorized by user"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        429:
          description: "Consent access exceeded"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
  /xs2a-premium/v1.3/accounts/{account-id}:
    get:
      tags:
      - "Account information service"
      summary: "Account info: Read Account Details"
      description: "Reads details about an account, with balances where required."
      operationId: "getAccount"
      parameters:
      - name: "account-id"
        in: "path"
        description: "This identification is denoting the addressed account. The account-id\
          \ is retrieved by using a “Read Account List” call. The account-id is the\
          \ “id” attribute of the account structure. Its value is constant at least\
          \ throughout the lifecycle of a given consent."
        required: true
        schema:
          type: "string"
      - name: "Consent-ID"
        in: "header"
        description: "Shall be contained since “Establish Consent Transaction” was\
          \ performed via this API before."
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "X-Request-ID"
        in: "header"
        description: "ID of the request, unique to the call, as determined by the\
          \ initiating party."
        required: true
        schema:
          type: "string"
          format: "uuid"
      - name: "PSU-IP-Address"
        in: "header"
        description: "The forwarded IP Address header field consists of the corresponding\
          \ HTTP request IP Address field between PSU and TPP. If PSU presence (currently\
          \ IP address) is provided with recurring consent then recurring consent\
          \ counter is not incremented. Therefore account data can be gathered without\
          \ limits."
        schema:
          type: "string"
      - name: "withBalance"
        in: "query"
        description: "If contained, this function reads the list of accessible payment\
          \ accounts including the booking balance. This call will be rejected if\
          \ the withBalance parameter is used in a case, where the access right on\
          \ balances is not granted in the related consent"
        schema:
          type: "boolean"
      - name: "X-API-Key"
        in: "header"
        description: "Authorisation key that can be acquired in TPP developer portal."
        required: true
        schema:
          type: "string"
      - name: "Authorization"
        in: "header"
        description: "Is contained only, if an OAuth2 based SCA was performed in the\
          \ related consent authorisation."
        schema:
          type: "string"
      - name: "PSU-ID"
        in: "header"
        description: "Client ID of the PSU in the bank."
        schema:
          type: "string"
      - name: "PSU-Corporate-ID"
        in: "header"
        description: "Corporate client ID of the PSU in the bank."
        schema:
          type: "string"
      responses:
        200:
          description: "No errors ocurred. Returns an account. In _links section viewBalances\
            \ and viewTransactions links will be used"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonGetAccountResponse"
        400:
          description: "One of mandatory parameters(headers, request body or query\
            \ parameters) missing or in incorrect format"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        401:
          description: "Consent expired, consent is not valid for requested resource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        403:
          description: "Consent absent, consent not authorized by user"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        404:
          description: "Account not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
        429:
          description: "Consent access exceeded"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonErrorResponse"
  /xs2a-premium/v1.3/accounts/{account-id}/balances:
    get:
      tags:
      - "Account information service"
      summary: "Account info: Read Balance"
      description: "Reads account data from a given account addressed by 'account-id'."
      operationId: "getAccountBalances"
      parameters:
      - name: "account-id"
