components:
  schemas:
    JsonErrorResponse:
      required:
      - "transactionStatus"
      type: "object"
      properties:
        psuMessage:
          type: "string"
        tppMessages:
          type: "array"
          items:
            $ref: "#/components/schemas/JsonMessage"
        transactionStatus:
          $ref: "#/components/schemas/TransactionStatus"
    JsonGetAccountBalancesResponse:
      required:
      - "balances"
      type: "object"
      properties:
        account:
          $ref: "#/components/schemas/JsonAccountReference"
        balances:
          type: "array"
          items:
            $ref: "#/components/schemas/JsonBalance"
    JsonGetAccountResponse:
      required:
      - "account"
      type: "object"
      properties:
        account:
          $ref: "#/components/schemas/JsonAccountDetails"
    JsonGetAccountTransactionsResponse:
      type: "object"
      properties:
        account:
          $ref: "#/components/schemas/JsonAccountReference"
        transactions:
          $ref: "#/components/schemas/JsonAccountReport"
        balances:
          type: "array"
          items:
            $ref: "#/components/schemas/JsonBalance"
    JsonGetAccountsResponse:
      required:
      - "accounts"
      type: "object"
      properties:
        accounts:
          type: "array"
          items:
            $ref: "#/components/schemas/JsonAccountDetails"
    JsonGetAuthorisationStatusResponse:
      type: "object"
      properties:
        scaStatus:
          $ref: "#/components/schemas/ScaStatus"
        authorisationId:
          type: "string"
        _links:
          $ref: "#/components/schemas/JsonLinks"
    JsonGetAuthorisationsResponse:
      type: "object"
      properties:
        authorisationsIds:
          type: "array"
          items:
            type: "string"
    JsonGetConsentResponse:
      required:
      - "access"
      - "combinedServiceIndicator"
      - "consentStatus"
      - "frequencyPerDay"
      - "recurringIndicator"
      - "validUntil"
      type: "object"
      properties:
        access:
          $ref: "#/components/schemas/JsonAccountAccess"
        recurringIndicator:
          type: "boolean"
          description: "true, if the consent is for recurring access to the account\
            \ data false, if the consent is for one access to the account data"
        validUntil:
          type: "string"
          description: "This parameter is indicates a valid until date for the requested\
            \ consent. The content is date in ISODate Format, e.g. 2017-10-30. For recurring consents validUntil must
            not be farther then 180 days in future."
        frequencyPerDay:
          type: "string"
          description: "This field indicates the requested maximum frequency for an\
            \ access without PSU involvement per day. For a one-off access, this attribute\
            \ is set to \"1\"."
        combinedServiceIndicator:
          type: "boolean"
          description: "Unsupported mandatory field. Must be set to false"
          example: false
        consentStatus:
          $ref: "#/components/schemas/ConsentStatus"
        _links:
          $ref: "#/components/schemas/JsonLinks"
    JsonGetConsentStatusResponse:
      type: "object"
      properties:
        consentStatus:
          $ref: "#/components/schemas/ConsentStatus"
    JsonPostAuthorisationsResponse:
      type: "object"
      properties:
        psuMessage:
          type: "string"
        tppMessages:
          type: "array"
          items:
            $ref: "#/components/schemas/JsonMessage"
        scaStatus:
          $ref: "#/components/schemas/ScaStatus"
        _links:
          $ref: "#/components/schemas/JsonLinks"
    JsonPostConsentsRequest:
      required:
      - "access"
      - "combinedServiceIndicator"
      - "frequencyPerDay"
      - "recurringIndicator"
      - "validUntil"
      type: "object"
      properties:
        access:
          $ref: "#/components/schemas/JsonAccountAccess"
        recurringIndicator:
          type: "boolean"
          description: "true, if the consent is for recurring access to the account\
            \ data false, if the consent is for one access to the account data"
        validUntil:
          type: "string"
          description: "This parameter is requesting a valid until date for the requested\
            \ consent. The content is the local ASPSP date in ISODate Format, e.g.\
            \ 2017-10-30. For recurring consents validUntil must not be farther then 180 days in future."
        frequencyPerDay:
          type: "string"
          description: "This field indicates the requested maximum frequency for an\
            \ access without PSU involvement per day. For a one-off access, this attribute\
            \ is set to \"1\"."
        combinedServiceIndicator:
          type: "boolean"
          description: "Unsupported mandatory field. Must be set to false"
          example: false
    JsonPostConsentsResponse:
      type: "object"
      properties:
        psuMessage:
          type: "string"
        tppMessages:
          type: "array"
          items:
            $ref: "#/components/schemas/JsonMessage"
        consentId:
          type: "string"
          format: "uuid"
        consentStatus:
          $ref: "#/components/schemas/ConsentStatus"
        _links:
          $ref: "#/components/schemas/JsonLinks"
    JsonGetAccountTransactionDetailsResponse:
      type: "object"
      properties:
        transactionsDetails:
          $ref: "#/components/schemas/JsonTransaction"
    JsonAccountAccess:
      type: "object"
      properties:
        accounts:
          type: "array"
          items:
            $ref: "#/components/schemas/JsonAccountReference"
        balances:
          type: "array"
          items:
            $ref: "#/components/schemas/JsonAccountReference"
        transactions:
          type: "array"
          items:
            $ref: "#/components/schemas/JsonAccountReference"
        additionalAccountInformation:
          $ref: "#/components/schemas/JsonAdditionalAccountInformation"
    JsonAccountDetails:
      required:
      - "currency"
      type: "object"
      properties:
        iban:
          type: "string"
        bban:
          type: "string"
        pan:
          type: "string"
        maskedPan:
          type: "string"
        msisdn:
          type: "string"
        currency:
          type: "string"
        resourceId:
          type: "string"
        name:
          type: "string"
        balances:
          type: "array"
          items:
            $ref: "#/components/schemas/JsonBalance"
        _links:
          $ref: "#/components/schemas/JsonLinks"
        ownerName:
          type: "string"
        ownerAddress:
          type: "string"
      description: "JsonAccountDetails must contain one of iban,bban,maskedPan,msisdn\
        \ or pan field"
    JsonAccountReference:
      type: "object"
      properties:
        iban:
          type: "string"
        bban:
          type: "string"
        pan:
          type: "string"
        maskedPan:
          type: "string"
        msisdn:
          type: "string"
        currency:
          type: "string"
      description: "Must contain one of iban,bban,maskedPan,msisdn or pan field"
    JsonAccountReport:
      required:
      - "booked"
      type: "object"
      properties:
        booked:
          type: "array"
          items:
            $ref: "#/components/schemas/JsonTransaction"
        pending:
          type: "array"
          items:
            $ref: "#/components/schemas/JsonTransaction"
        _links:
          $ref: "#/components/schemas/JsonLinks"
    JsonAmount:
      required:
      - "amount"
      - "currency"
      type: "object"
      properties:
        currency:
          type: "string"
        amount:
          type: "string"
    JsonBalance:
      required:
      - "balanceAmount"
      - "balanceType"
      type: "object"
      properties:
        balanceAmount:
          $ref: "#/components/schemas/JsonAmount"
        balanceType:
          $ref: "#/components/schemas/BalanceType"
        referenceDate:
          type: "string"
        lastChangeDateTime:
          type: "string"
    JsonHref:
      type: "object"
      properties:
        href:
          type: "string"
    JsonLinks:
      type: "object"
      properties:
        scaRedirect:
          $ref: "#/components/schemas/JsonHref"
        scaOAuth:
          $ref: "#/components/schemas/JsonHref"
        self:
          $ref: "#/components/schemas/JsonHref"
        status:
          $ref: "#/components/schemas/JsonHref"
        account:
          $ref: "#/components/schemas/JsonHref"
        balances:
          $ref: "#/components/schemas/JsonHref"
        transactions:
          $ref: "#/components/schemas/JsonHref"
        transactionDetails:
          $ref: "#/components/schemas/JsonHref"
        first:
          $ref: "#/components/schemas/JsonHref"
        next:
          $ref: "#/components/schemas/JsonHref"
        previous:
          $ref: "#/components/schemas/JsonHref"
        last:
          $ref: "#/components/schemas/JsonHref"
        download:
          $ref: "#/components/schemas/JsonHref"
        updatePsuIdentification:
          $ref: "#/components/schemas/JsonHref"
        startAuthorisation:
          $ref: "#/components/schemas/JsonHref"
        scaStatus:
          $ref: "#/components/schemas/JsonHref"
    JsonMessage:
      required:
      - "category"
      - "code"
      type: "object"
      properties:
        category:
          type: "string"
        code:
          type: "string"
        path:
          type: "string"
        text:
          type: "string"
    JsonTransaction:
      type: "object"
      properties:
        transactionId:
          type: "string"
        debtorName:
          type: "string"
        debtorAccount:
          $ref: "#/components/schemas/JsonAccountReference"
        creditorName:
          type: "string"
        creditorAccount:
          $ref: "#/components/schemas/JsonAccountReference"
        transactionAmount:
          $ref: "#/components/schemas/JsonAmount"
        bookingDate:
          type: "string"
        valueDate:
          type: "string"
        remittanceInformationUnstructured:
          type: "string"
          description: "Reference issued used to establish a link between the payment\
            \ of an invoice and the invoice instance."
        remittanceInformationStructured:
          required:
          - "reference"
          type: "object"
          properties:
            reference:
              type: "string"
            referenceType:
              type: "string"
            referenceIssuer:
              type: "string"
    TransactionStatus:
      type: "string"
      enum:
      - "ACCC"
      - "ACCP"
      - "ACSC"
      - "ACSP"
      - "ACTC"
      - "ACWC"
      - "ACWP"
      - "RCVD"
      - "PDNG"
      - "RJCT"
      - "CANC"
      - "ACFC"
      - "PATC"
      - "PART"
    ScaStatus:
      type: "string"
      enum:
      - "received"
      - "psuIdentified"
      - "psuAuthenticated"
      - "scaMethodSelected"
      - "started"
      - "finalised"
      - "failed"
      - "exempted"
    BalanceType:
      type: "string"
      enum:
      - "closingBooked"
      - "expected"
      - "openingBooked"
      - "interimAvailable"
      - "interimBooked"
      - "forwardAvailable"
      - "nonInvoiced"
    ConsentStatus:
      type: "string"
      enum:
      - "received"
      - "rejected"
      - "valid"
      - "revokedByPsu"
      - "expired"
      - "terminatedByTpp"
    JsonAdditionalAccountInformation:
      type: "object"
      properties:
        ownerName:
          type: "array"
          items:
            $ref: "#/components/schemas/JsonAccountReference"
        ownerAddress:
          type: "array"
          items:
            $ref: "#/components/schemas/JsonAccountReference"