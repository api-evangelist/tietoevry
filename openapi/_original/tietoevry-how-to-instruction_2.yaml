  title: Getting started!
  description: |
    
    Open Banking platform allows you to try out our OpenFinance and PSD2 compliant APIs at real time. All you need to do start using our APIs is to sign up in the portal.
    
    # News
    ## 90-days validity period of an AIS consent extended to 180-days 

    In accordance with the EBA amendment under Commission Delegated Regulation (EU) 2022/2360, RTS Article 10a for AISPs, an SCA exemption for AIS consents has been implemented. The validity period for 90-day consent has been extended to 180-days. This interface has been made available in the Sandbox environment.

    To test the 180-days SCA consent exemption, it is necessary to ensure that newly created consents include a **validUntil** parameter and the date value is set to 180 days ahead in the future.   
    
    
    # Signing up
    Signing up at Tietoevry Open Banking portal takes just several minutes and requires no certificates - just fill in some contact details and you are done!
    
    Go to [Sign Up](https://openbanking.api.tietoevry.com/sign-up) now!
    
    # Signing In
    Once you have signed up at Tietoevry Open Banking portal you are ready to sign in and get access to our PSD2 APIs.
    
    Go to [Sign In](https://openbanking.api.tietoevry.com/sign-in) now
    
    # Creating an Application 

    At least one application in My Apps section must be created. For your convenience we have created initial app for you: “My Test App”. This app is available right away. 
    
    Go to [My Apps/Sandbox](https://openbanking.api.tietoevry.com/workplace/applications/sandbox) now!
    
    **If you decide to use our initial app "My Test App", you can skip the rest of this section.**
    
    You might want to create your own apps to be able to choose the API version or restrict the access to APIs. In this case simply click CREATE APPLICATION button, fill in the fields and add at least one application API set:
    
    |**Field**|**Description**|
    |---|---|
    | **Application name** | any name you would like your app to be called in Open Banking portal.|
    |**Application description**| write some words describing your app, so that you can quickly recall what you have created it for – this might be handy, when you have created multiple apps.|
    |**API Group** | choose XS2A for accessing the PSD2 compliant APIs.
    |**API group version**| choose any version of APIs that is available in the dropdown box. |
    
    
    >*TIP: you can always explore any group version of our API in the PSD2 XS2A APIs [documentation section](https://openbanking.api.tietoevry.com/documentation/xs2a).*
    
    
    **Select API set** – choose what type of API sets you would like to access (PIS, AIS or PIIS). You can choose any combination of API sets.
    
    Click *NEXT* button
    
    QWAC and QSeal certificates are not required in the Sandbox mode, so you can just click *NEXT* button.
    
    Enter required legal data and click *CREATE* button. Congratulations, you are done now!
    
    # Getting your API KEY
    API KEY is a unique value that identifies your app and it must be added to every call you make on our APIs.
    
    To get the API KEY, go to [My Apps/Sandbox](https://openbanking.api.tietoevry.com/workplace/applications/sandbox), choose any of your apps and click on Manage. You will enter you app and will be able to see or copy your API KEY – just click the eye icon or COPY API KEY button.
    
    # API Group version
    
    Make sure you know the version of APIs that is chosen in the app you are going to use. It is important, because you will need to add it to every call you make on our APIs. 
    
    To find out the version of APIs that is set in your app, just go to [My Apps/Sandbox](https://openbanking.api.tietoevry.com/workplace/applications/sandbox), choose an app that you are going to use and click **Manage**. You will enter you app and then you will have to click **MANAGE** button. After that the **EDIT VERSION** button will appear. After clicking this button, you will be able to see the version of your app (**Application version**) and the version of APIs (**API group version**).
    
    The **API group version** is the one that you need to know when calling our APIs.
    
    # Calling APIs
    Now when you have the **API KEY** of the app you want to use and the **API version** that is chosen in this app you can make calls to all endpoints of our APIs.
    
    You can make your REST calls to our API by any means: cURL calls, calls from your code or calls from specialized tools, like [Postman](https://www.postman.com/)
    
    Please reference:
    - [API Catalog](https://openbanking.api.tietoevry.com/api-catalog) - for the list of available APIs
    - [PSD2 XS2A APIs](https://openbanking.api.tietoevry.com/documentation/xs2a) documentation section – for detailed specification of all endpoints.
    
    >*TIP: the hostname of all endpoints, regardless of the API group or type, is the same*: `https://openbanking.api.tietoevry.com`
    
    
    # Example of API calls
    ___
    
    ## Getting list of accounts
    
    Access to any account information is possible only with a consent of a customer (PSU). Therefore, before calling accounts endpoint, the CONSENT must be created and confirmed by PSU.
    
    ![Image](/img/example-scheme.png)
    
    ## Step 1: Creating a consent
    
    You need to *create a Consent*, by calling the “Establish Consent Transaction” endpoint:
    
    ![Image](/img/consents-ep.png)
    
    See [PSD2 XS2A APIs](https://openbanking.api.tietoevry.com/documentation/xs2a) for details (**Choose Access to Account API** -> **Account Consent service** -> **Account info: Establish Consent Transaction**)
    
    Here is an example of the call:
    
    ```
    curl -X POST 'https://openbanking.api.tietoevry.com/sandbox/xs2a/v1.3/consents' \
    --header 'X-API-Key: ec922c1d-4d4a-4b44-85e9-070b37da4164' \
    --header 'X-Request-ID: 0f4ef115-37d8-46fd-b103-7fb298df63df' \
    --header 'Content-Type: application/json' \
    --header 'TPP-Redirect-URI: https://www.google.com' \
    --data-raw '{
        "access": {
          "accounts": [],
          "balances": [],
          "transactions": []
      },
    "recurringIndicator": true,
    "validUntil": "2021-08-30",
    "frequencyPerDay": 1000,
    "combinedServiceIndicator": false
    }'
    ```
    Variables you need to know:
    
    PATH:

    |**Variable**|**Description**|
    |---|---|
    |**{sandbox/live}**|you need to use sandbox as you are making call for the Sandbox app|
    |**{version}**|this is API version that is set in the app you are using|
    
    HEADERS:

    |**Variable**|**Description**|
    |---|---|
    |**'X-API-Key’**|this is a API KEY value of the APP you are using|
    |**'X-Request-ID’**|this is a unique identifier in UUID format|
    |**‘TPP-Redirect-URI’**|this is a URL that you want the PSU to be redirected to after he has confirmed the consent|
    
    BODY:

    |**Variable**|**Description**|
    |---|---|
    |**Access**| this field specifies what kind of data must be available. In this example, the full access is requested: access to Accounts, Balances and Transactions of PSU.|
    |**recurringIndicator**| indicates if this consent can be used only once or multiple times. In this example it can be used multiple times.
    |**validUntil**| sets the validity period of this consent. Note: maximum recurring consent validity period is 90 days
    |**frequencyPerDay**| sets the daily limit on using this consent for cases when recurringIndicator is true.
    |**combinedServiceIndicator** | this must be set to false as our API do not support combined services
    
    Response example:
    
    ```
    {
    "consentStatus": "received",
    "consentId": "77cbe66e-6084-45c9-ab4c-779b53e43740",
    "_links": {
        "self": {
            "href": "/sandbox/xs2a/v1.3/consents/77cbe66e-6084-45c9-ab4c-779b53e43740"
        },
        "status": {
            "href": "/sandbox/xs2a/v1.3/consents/77cbe66e-6084-45c9-ab4c-779b53e43740/status"
        },
        "scaRedirect": {
            "href": "https://openbanking.api.tietoevry.com/mock_sca/auth/tieto/da66a863-3427-4d46-848c-77fcfb7a3c06"
          }
        },
      "authorisationId": "da66a863-3427-4d46-848c-77fcfb7a3c06",
      "psuMessage": "Go to authorization url!"
      }
    ```
    Most important fields of this response are:
    
    |Field|Description|
    |---|---|
    |**consentStatus** | indicates the status of the consent. “received” means it is created, but not confirmed by PSU yet.
    |**consentId** | a unique identifier of this consent. To be used later for calls to Account API
    |**scaRedirect** | contains a href link to authorization page, where PSU can confirm the consent.
    
    ## Step 2: Confirming the consent
    
    All you need to do to confirm the consent is to use the scaRedirect link and copy it to the browser. This link will open an authorization page that simulates SCA page of a bank, where PSU can authenticate himself and then confirm the consent.
    
    Since this is Sandbox and the SCA page is a simulation, you need to use a fake PSUs (Customers) that are listed in the [My Sandbox](https://openbanking.api.tietoevry.com/workplace/sandbox), for example Benjamin Lee, whose credentials for authentication are:
    - username: **benlee**
    - password: **benlee**
    
    >*TIP*: Feel free to use any Customer that is listed on [My Sandbox](https://openbanking.api.tietoevry.com/workplace/sandbox) page.
    
    After authentication in the browser, you will be shown the consent data and all you need to do to confirm the consent is click **CONFIRM** button.
    
    After CONFIRM button is pressed the browser redirects to the URL that was used in **TPP-Redirect-URI** header during creation of this consent.
    
    That’s it – the consent is confirmed now and is ready to be used!
    
    >*TIP*: you can always check status of the consent by calling the “Get Consent Request” endpoint (for {consent-id} path variable use the **consentId** of the consent you are checking up):
    
    ![Image](/img/consent-id-ep.png)
    
    
    See [PSD2 XS2A APIs](https://openbanking.api.tietoevry.com/documentation/xs2a) for details (**Choose Access to Account API** -> **Account Consent service** -> **Account info: Get Consent Request**)
    
    ## Step 3: Getting a list of accounts
    
    Now, since you’ve created a consent and PSU (Customer) has confirmed it, you can use this consent to retrieve account information.
    
    
    Simply take the **consentId** value of the confirmed consent and put it into the **Consent-ID** header of the “Read Account List” endpoint
    
    ![Image](/img/accounts-ep.png)
    
      See [PSD2 XS2A APIs](https://openbanking.api.tietoevry.com/documentation/xs2a) for details (**Choose Access to Account API** -> **Account information service** -> **Account info: Read Account List**)
    
      Here is an example of the call:
    
    ```
    curl -X \
    GET 'https://openbanking.api.tietoevry.com/sandbox/xs2a/v1.3/accounts/?withBalance=true' \
    --header 'X-API-Key: ec922c1d-4d4a-4b44-85e9-070b37da4164' \
    --header 'X-Request-ID: fd039c51-780b-4af5-8cad-43aa210ab250' \
    --header 'Consent-ID: 77cbe66e-6084-45c9-ab4c-779b53e43740' \
    --header 'Accept: application/json' \
    --data-raw ''
    ```
    
    *Variables you need to know:*
    
    PATH:

    |Variable|Description|
    |---|---|      
    |**{sandbox/live}**| you need to use sandbox as you are making calls for the Sandbox app
    |**{version}**| this is API version that is set in the app you are using
    
    HEADERS:

    |Variable|Description|
    |---|---|
    |**'X-API-Key’** | this is a API KEY value of the APP you are using
    |**'X-Request-ID’**| this is a unique identifier in UUID format
    |**‘Consent-ID’**| the **consentId** of the consent you are using
    
    
    Response example:
    ```
      {
        "accounts": [
          {
            "iban": "BANK95273278098985433",
            "currency": "EUR",
            "resourceId": "450083b1-8af9-43fe-b564-36f64598f9e9",
            "name": "Account Name",
            "balances": [
                {
                    "balanceAmount": {
                        "currency": "EUR",
                        "amount": "556.00"
                    },
                    "balanceType": "closingBooked"
                },
                {
                  "balanceAmount": {
                  "currency": "EUR",
                  "amount": "556.00"
                },
                "balanceType": "expected"
              }
            ],
            "_links": {
                "balances": {
                    "href": "/sandbox/xs2a/v1.3/accounts/450083b1-8af9-43fe-b564-36f64598f9e9/balances"
                },
                "transactions": {
                    "href": "/sandbox/xs2a/v1.3/accounts/450083b1-8af9-43fe-b564-36f64598f9e9/transactions?dateFrom=2017-01-01&bookingStatus=both"
              }
            }
          }
        ]
      }
    ```
    
    # Making a payment
    ___
    
    Making any payment is possible only with confirmation from a customer (PSU). Therefore, each payment must be initiated and then confirmed by PSU.
    
    ![image](/img/making-a-payment-scheme.png)
    
    ## Step 1: Initiating a payment
    
    You need to initiate a Payment, by calling the “Payment Initiation with JSON encoding of the Payment Instruction” endpoint:
    
    ![Image](/img/payment-product-ep.png)
    
    See [PSD2 XS2A APIs](https://openbanking.api.tietoevry.com/documentation/xs2a) for details (Choose Payment Initiation API -> Payment Initiation Service -> Payment: Payment Initiation with JSON encoding of the Payment Instruction)
    
    Here is an example of the call:
    
      ```
      curl -X POST 'https://openbanking.api.tietoevry.com/sandbox/xs2a/v1.3/payments/sepa-credit-transfers' \
      --header 'X-API-Key: ec922c1d-4d4a-4b44-85e9-070b37da4164' \
      --header 'X-Request-ID: e3f2e4d3-e9c8-484d-9ef5-c0cc412e6d05' \
      --header 'Content-Type: application/json' \
      --header 'TPP-Redirect-URI: https://www.google.com' \
      --header 'PSU-IP-Address: 1.2.3.4' \
      --header 'TPP-Nok-Redirect-URI: https://www.amazon.com' \
      --data-raw '{
      "debtorAccount": {
        "iban": "BANK95273278098985433"
      },
      "creditorAccount": {
        "iban": "BANK98725222937647798"
      },
      "creditorAddress":{"country":"EE"},
      "creditorName": "James Bond",
      "instructedAmount": {
        "currency": "EUR",
        "amount": "7.00"
      },
      "remittanceInformationUnstructured": "PSD2 payment 25.06.2021"
    }'
    ```
    
    Variables you need to know:
    
    PATH:

    |Variable|Description|
    |---|---|
    |**{sandbox/live}**| you need to use sandbox as you are making calls for the Sandbox app
    |**{version}**| this is API version that is set in the app you are using
    |**{payment-product}**| simply use sepa-credit-transfers
    
    HEADERS:

    |Variable|Description|
    |---|---|
    |**‘X-API-Key’**| this is a API KEY value of the APP you are using| 
    |**'X-Request-ID’**| this is a unique identifier in UUID format|
    |**‘TPP-Redirect-URI’**| this is a URL that you want the PSU to be redirected to after he has confirmed the payment|
    |**'PSU-IP-Address’**| just fill in with any IP address – there is no validation turned on in the Sandbox.|
    |**'TPP-Nok-Redirect-URI’**| this is a URL that you want the PSU to be redirected to in case he has declined to confirm the payment|
    
    BODY:
    
    All fields are self-explanatory.
    Just make sure the **iban** of the source account (**debtorAccount**) belongs to the fake customers listed in [My Sandbox](https://openbanking.api.tietoevry.com/workplace/applications/sandbox) page.

    Response example:
    ```
    {
    "transactionStatus": "RCVD",
    "paymentId": "a5a92d80-bb8e-40a7-8795-03a57a184afb",
    "_links": {
        "self": {
            "href": "/sandbox/xs2a/v1.3/payments/sepa-credit-transfers/a5a92d80-bb8e-40a7-8795-03a57a184afb"
        },
        "status": {
            "href": "/sandbox/xs2a/v1.3/payments/sepa-credit-transfers/a5a92d80-bb8e-40a7-8795-03a57a184afb/status"
        },
        "scaRedirect": {
            "href": "https://openbanking.api.tietoevry.com/mock_sca/auth/tieto/35a7b966-b660-4a58-af60-04aa29565fca"
        }
      },
    "authorisationId": "35a7b966-b660-4a58-af60-04aa29565fca",
    "psuMessage": "Go to authorization url!"
    }

      ```

    Most **important** fields of this response are:

    |Field|Description|
    |---|---|
    |**transactionStatus**| indicates the status of the payment. “RCVD” means it is initiated, but not confirmed by PSU yet.
    |**paymentId**| a unique identifier of this payment. To be used later for calls to other Payment API (e.g. Payment Details, etc.)
    |**scaRedirect**| contains a *href* link to authorization page, where PSU can confirm the payment.
    
    ## Step 2: Confirming the payment
    
    All you need to do to confirm the payment is to use the scaRedirect link and copy it to the browser. This link will open an authorization page that simulates SCA page of a bank, where PSU can authenticate himself and then confirm the payment.
    
    Since this is Sandbox and the SCA page is a simulation, you need to use a fake PSUs (Customers) that are listed in the [My Sandbox](https://openbanking.api.tietoevry.com/workplace/sandbox). 
    
    The Customer you use to authenticate and confirm the payment must be the owner of **debtorAccount** used as **debtorAccount**  in the body of the Payment Initiation call (see [Step 1](##Step-1:-Initiating-a-payment)).
    
    For example, if the payment have been initiated with this source account
    
    `"debtorAccount": { "iban": "BANK95273278098985433" …`
    
    Then the Customer who needs to confirm it is Benjamin Lee, whose credentials for authentication are:
    
      - username: **benlee**
      - password: **benlee**
    
    >*TIP*: see all Customers and their accounts on [My Sandbox](https://openbanking.api.tietoevry.com/workplace/sandbox) page.
    
    After authentication in the browser, you will be shown the payment details all you need to do to confirm the payment is click CONFIRM button.
    
    After CONFIRM button is pressed the browser redirects to the URL that was used in TPP-Redirect-URI header during initiation of this payment.
    
    That’s it – the payment is confirmed and it gets executed immediately!
    
    >*TIP*: you can always check status of the payment by calling the “Get Payment Details” endpoint (for {payment-id} path variable use the paymentId of the payment you are checking up):
    
    ![Image](/img/payment-id-ep.png)
    
    See [PSD2 XS2A APIs](https://openbanking.api.tietoevry.com/documentation/xs2a) for details (Choose **Payment Initiation API** -> **Payment Initiation Service** -> **Payment: Get Payment Details**)
    
      # Payment Recall
    ___
    
     ## Step 1: Initiating a payment Recall
    
    To make recall the payment you need to know "transactionId" it is the same as "paymentId" after Initiating a payment,   and info about the payment itself. 
    
    Recall is possible only with confirmation from a customer (PSU) who made the payment. 
    
    
    Here is an example of the call:
    
      ```
      curl -X 'POST https://openbanking.obap-dev-egliehar.ob-k8s.konts.lv/sandbox/xs2a-premium/v1.3/recall-payments/sepa-credit-transfers' \
      --header 'X-API-Key: 3203bc84-3ab7-433f-a1fa-116dbbe97ec5' \
      --header 'Content-Type: application/json' \
      --header 'X-Request-ID: bfe6afb6-6d02-4e4f-be2c-f6c500fc8903' \
      --header 'TPP-Redirect-URI: https://openbanking.api.tietoevry.com' \
      --header 'PSU-IP-Address: 10.20.30.40'
      --header 'TPP-Nok-Redirect-URI: https://openbanking.api.tietoevry.com/documentation' \
      --header 'TPP-Explicit-Authorisation-Preferred: false'\

    --data-raw '{
    "paymentIdentification": {
    "transactionId": "46354385-0a58-4663-8da6-83fb7e3a3f1f"
    },
    "instructedAmount" : {
    "currency": "EUR",
    "amount": "1.00"
    },
     "debtorAccount" : {
    "iban": "BANK95273278098985433"
    },
     "creditorAccount" : {
     "iban": "BANK06850389716643218"
    },
    "reason" : {
    "code": "CUST",
    "information": "Duplicate payment"
     }
    }'
    
    ```
    
    Variables you need to know:
    
    PATH:

    |Variable|Description|
    |---|---|
    |**{sandbox/live}**| you need to use sandbox as you are making calls for the Sandbox app
    |**{version}**| this is API version that is set in the app you are using
    |**{payment-product}**| simply use sepa-credit-transfers
    
    HEADERS:

    |Variable|Description|
    |---|---|
    |**‘X-API-Key’**| this is a API KEY value of the APP you are using| 
    |**'X-Request-ID’**| this is a unique identifier in UUID format|
    |**‘TPP-Redirect-URI’**| this is a URL that you want the PSU to be redirected to after he has confirmed the payment|
    |**'PSU-IP-Address’**| just fill in with any IP address – there is no validation turned on in the Sandbox.|
    |**'TPP-Nok-Redirect-URI’**| this is a URL that you want the PSU to be redirected to in case he has declined to confirm the payment|
    |**'TPP-Explicit-Authorisation-Preferred’**|this is a true or false statement for a URL to be generated within the request or making sapereta authorisation call|
    
    BODY:
    
    All fields are self-explanatory.
    Just make sure the **iban** of the source account (**debtorAccount**) belongs to the fake customers listed in [My Sandbox](https://openbanking.api.tietoevry.com/workplace/applications/sandbox) page.

    Response example:
    
    ```
    {
    "transactionStatus": "RCVD",
    "paymentId": "688c40b0-dc00-4be9-a7cb-d3348c3eef28",
    "_links": {
        "self": {
            "href": "/sandbox/xs2a/v1.3/recall-payments/sepa-credit-transfers/688c40b0-dc00-4be9-a7cb-d3348c3eef28"
        },
        "status": {
            "href": "/sandbox/xs2a/v1.3/recall-payments/sepa-credit-transfers/688c40b0-dc00-4be9-a7cb-d3348c3eef28/status"
        },
        "scaRedirect": {
            "href": "https://openbanking.obap-dev-everts1.ob-k8s.konts.lv/mock_sca/auth/tieto/03652328-8674-44ef-80a9-97d59ae4b110"
        }
    },
    "authorisationId": "03652328-8674-44ef-80a9-97d59ae4b110",
    "tppMessages": [
        {
            "category": "MSG",
            "code": "INFO",
            "text": "Go to authorization url!"
        }
    ]
    }
    
    ```
    Most **important** fields of this response are:

    |Field|Description|
    |---|---|
    |**transactionStatus**| indicates the status of the payment. “RCVD” means it is initiated, but not confirmed by PSU yet.
    |**paymentId**| a unique identifier of this payment. To be used later for calls to other Payment API (e.g. Payment Details, etc.)
    |**scaRedirect**| contains a *href* link to authorization page, where PSU can confirm the payment.
    |**authorisationId**| a unique identifier of this payment recall. To be used later for calls to see Payment Recall statuss.
    
    
    
     ## Step 2: Confirming the payment Recall
    
    All you need to do to confirm the Payment Recal is to use the scaRedirect link and copy it to the browser.
