    # Funds Confirmation
    
    Checking any account’s funds availability is possible only with a consent of a customer (PSU). Therefore, before calling funds confirmation endpoint, the CONSENT must be created and confirmed by PSU.
    
    ![Image](/img/funds-confirmation-scheme.png)
    
    ## Step 1: Creating a consent
    
    You need to **create a Consent**, by calling the “Establish Funds Confirmation Consent Transaction” endpoint:
    
    ![Image](/img/funds-confirmation-consents-ep.png)
    
    See [PSD2 XS2A APIs](https://openbanking.api.tietoevry.com/documentation/xs2a) for details (Choose **Fund Confirmation API**-> **Confirmation of Funds Service consent** -> **Funds confirm: Establish Funds Confirmation Consent Transaction**)
    
    Here is an example of the call:
    
    ```
    curl -X POST 'https://openbanking.api.tietoevry.com/sandbox/xs2a/v1.3/funds-confirmation-consents' \
    --header 'X-API-Key: ec922c1d-4d4a-4b44-85e9-070b37da4164' \
    --header 'X-Request-ID: 099e9bcb-d602-4f8e-8e31-24224791f2a3' \
    --header 'Content-Type: application/json' \
    --header 'TPP-Redirect-URI: https://www.google.com' \
    --data-raw '{
        "account": {
            "iban": "BANK95273278098985433",
            "currency": "EUR"
        },
        "instructedAmount": {
            "amount": "10",
            "currency": "EUR"
        },
        "combinedServiceIndicator": false
    }'

    ```
    
    >Variables you need to know:
    
    PATH:

    |Variable|Description|
    |---|---|
    |**{sandbox/live}**| you need to use sandbox as you are making calls for the Sandbox app
    |**{version}**| this is API version that is set in the app you are using
    
    HEADERS:

    |Variable|Description|
    |---|---|
    |**'X-API-Key’**|this is a API KEY value of the APP you are using 
    |**'X-Request-ID’**|this is a unique identifier in UUID format|
    |**‘TPP-Redirect-URI’**|this is a URL that you want the PSU to be redirected to after he has confirmed the consent
    
    BODY:

    |Variable|Description|
    |---|---|
    |**iban**| must belong to the fake customers listed in My Sandbox page.
    |**amount**| is the value of funds you want to be able to check.
    |**combinedServiceIndicator**| this must be set to false as our API do not support combined services
    
    Response example:
    
    ```
    {
    "consentStatus": "received",
    "consentId": "cbbca841-4849-4ef4-a671-fad466603229",
    "_links": {
        "self": {
            "href": "/sandbox/xs2a/v1.3/funds-confirmation-consents/cbbca841-4849-4ef4-a671-fad466603229"
        },
        "status": {
            "href": "/sandbox/xs2a/v1.3/funds-confirmation-consents/cbbca841-4849-4ef4-a671-fad466603229/status"
        },
        "scaRedirect": {
            "href": "https://openbanking.api.tietoevry.com/mock_sca/auth/tieto/3937a30a-e9c4-476d-9555-5dbfa135463d"
        }
    },
    "authorisationId": "3937a30a-e9c4-476d-9555-5dbfa135463d",
    "psuMessage": "Go to authorization url!"
    }
    ```
    
    Most important fields of this response are:
    
    |Field|Description|
    |---|---|
    |**consentStatus**| indicates the status of the consent. “received” means it is created, but not confirmed by PSU yet.
    |**consentId**| a unique identifier of this consent. To be used later for calls to Account API
    |**scaRedirect**| contains a href link to authorization page, where PSU can confirm the consent.
    
    ## Step 2: Confirming the Consent
    
    All you need to do to confirm the consent is to use the scaRedirect link and copy it to the browser. This link will open an authorization page that simulates SCA page of a bank, where PSU can authenticate himself and then confirm the consent.
    
    Since this is Sandbox and the SCA page is a simulation, you need to use a fake PSUs (Customers) that are listed in the [My Sandbox](https://openbanking.api.tietoevry.com/workplace/sandbox).

    The Customer you use to authenticate and confirm the consent must be the owner of **iban** used in the body of **Consent creation** call (see [Step 1](##Step-1:-Creating-a-consent)).
    
    For example, if the consent have been created with this account
    ```
      "account": { 
        "iban": "BANK95273278098985433" 
        …
      }
    ```
    
    Then the Customer who needs to confirm it is Benjamin Lee, whose credentials for authentication are:
    
      - username: **benlee**
      - password: **benlee**
    
    >*TIP*: see all Customers and their accounts on [My Sandbox](https://openbanking.api.tietoevry.com/workplace/sandbox) page.
    
    After authentication in the browser, you will be shown the consent data and all you need to do to confirm the consent is click CONFIRM button.
    
    After CONFIRM button is pressed the browser redirects to the URL that was used in TPP-Redirect-URI header during creation of this consent.
    
    That’s it – the consent is confirmed now and is ready to be used
    
    >*TIP*: you can always check status of the consent by calling the “Get Funds Confirmation Consent Request” endpoint (for {consent-id} path variable use the **consentId** of the consent you are checking up):
    
    ![Image](/img/funds-consent-id-ep.png)
    
    See [PSD2 XS2A APIs](https://openbanking.api.tietoevry.com/documentation/xs2a) for details (Choose Fund Confirmation API-> Confirmation of Funds Service consent -> Funds confirm: Get Funds Confirmation Consent Request)
    
    ## Step 3: Checking the funds availability

    Now, since you’ve created a consent and PSU (Customer) has confirmed it, you can use this consent to check funds availability.

    >***Please, note: Funds confirmation consent can be used only once!***

    Simply take the **consentId** value of the confirmed consent and put it into the **Consent-ID** header of the “Confirmation of Funds Request” endpoint
    
    ![Image](/img/funds-confirmation-ep.png)
    
    See [PSD2 XS2A APIs](https://openbanking.api.tietoevry.com/documentation/xs2a) for details (Choose **Fund Confirmation API**-> **Confirmation of Funds Service** -> **Funds confirm: Confirmation of Funds Request**)
    
    Here is an example of the call:
      ```
        curl -X POST 'https://openbanking.api.tietoevry.com/sandbox/xs2a/v1.3/funds-confirmations' \
        --header 'X-API-Key: ec922c1d-4d4a-4b44-85e9-070b37da4164' \
        --header 'X-Request-ID: 8f7001da-1aa8-4b36-aaaf-9a67b08528bd' \
        --header 'Content-Type: application/json' \
        --header 'Consent-ID: cbbca841-4849-4ef4-a671-fad466603229' \
        --data-raw '{
          "account": {
            "iban": "BANK95273278098985433",
            "currency": "EUR"
          },
          "instructedAmount": {
            "currency": "EUR",
            "amount": "10"
          }
        }'
      ```
    
      Variables you need to know:
    
      PATH:

      |Variable|Description|
      |---|---|
      |**{sandbox/live}**| you need to use sandbox as you are making calls for the Sandbox app
      |**{version}**| this is API version that is set in the app you are using
    
      HEADERS:
    
      |Variable|Description|
      |---|---|
      |**'X-API-Key’**| this is a API KEY value of the APP you are using 
      |**'X-Request-ID’**| this is a unique identifier in UUID format
      |**‘Consent-ID’**| the consentId of the consent you are using
    
      BODY:
    
      **account** and **instructedAmount** – must be identical to the once used in the body of **Consent creation** call (see [Step 1](##Step-1:-Creating-a-consent)).

      Response example:
      ```
      {
      "fundsAvailable": true
      }

      ```
       # Request to Pay
    ___
    
       Before making request to pay there is a need to prepare for way to receive more than one authorisation SCA link. This example we will use homepage that allows you to create an unique endpoint to collect incoming real time requests  [Request Inspector](https://requestinspector.com).

       Here is an example of the call
    
       ```
      curl -X POST https://openbanking.obap-dev-egliehar.ob-k8s.konts.lv/sandbox/xs2a-premium/v1.3/subscriptions-request-to-pay

      --header 'X-API-Key: 3203bc84-3ab7-433f-a1fa-116dbbe97ec5' \
      --header 'X-Request-ID: bfe6afb6-6d02-4e4f-be2c-f6c500fc8903' \
      --header 'TPP-Redirect-URI: https://openbanking.api.tietoevry.com' \
      --header 'TPP-Nok-Redirect-URI: https://openbanking.api.tietoevry.com/documentation' \
      --header 'TPP-Explicit-Authorisation-Preferred: false' \
      --header 'PSU-IP-Address: 10.20.30.40' \
      --header 'Content-Type: application/json' \

      --data-raw '{
      "subscriptionEntries" : [
    {
      "accountId": {
      "iban": "BANK95273278098985433"
    },
      "apiClientPrimaryPushURI": "https://requestinspector.com/inspect/01gkkd8pj6gcdra5gatv98zcgh"
    }
    ]
    }'

    ```
    
       This will allow you to see information sent to there https://requestinspector.com/p/01gkkd8pj6gcdra5gatv98zcgh   

       In the image below there is example, how it looks like, when you get information. 
    ![image](/img/webview.png)
    
    ## Step 1: Initiating a request to pay.
    
      You need to initiate a request to pay, endpoint.
      Here is an example of the call
    
       ```
      curl -X POST https://openbanking.obap-dev-egliehar.ob-k8s.konts.lv/sandbox/xs2a-premium/v1.3/request-to-pay/sepa-credit-transfers
      --header 'X-API-Key: 3203bc84-3ab7-433f-a1fa-116dbbe97ec5' \
      --header 'X-Request-ID: bfe6afb6-6d02-4e4f-be2c-f6c500fc8903' \
      --header 'TPP-Redirect-URI: https://openbanking.api.tietoevry.com' \
      --header 'TPP-Nok-Redirect-URI: https://openbanking.api.tietoevry.com/documentation' \
      --header 'TPP-Explicit-Authorisation-Preferred: false' \
      --header 'PSU-IP-Address: 10.20.30.40' \
      --header 'Content-Type: application/json' \
      --data-raw '{
      "instructedAmount" : 
    {
      "currency": "EUR",
      "amount": "23.00"
    },
      "debtorAccount" : {
      "iban": "BANK95273278098985433"
    },
      "creditorAccount" : {
      "iban": "BANK06850389716643218"
    },
      "remittanceInformationUnstructured": "test2"
    }
    
    ```
       ## Step 2: Confirming the request to pay
    
    All you need to do to confirm the request to pay is to use the scaRedirect link and copy it to the browser. This link will open an authorization page that simulates SCA page of a bank, where PSU can authenticate himself and then confirm the request to pay.
    
    Since this is Sandbox and the SCA page is a simulation, you need to use a fake PSUs (Customers) that are listed in the [My Sandbox](https://openbanking.api.tietoevry.com/workplace/sandbox).

    The Customer you use to authenticate and confirm the request to pay must be the owner of **iban** used in the body of **request to pay** call (see [Step 1](##Step-1:-Creating-a-consent-request-to-pay)).
    
    For example, if the consent have been created with this account
    ```
      "account": { 
        "iban": "BANK95273278098985433" 
        …
      }
    ```
    
    Then the Customer who needs to confirm it is Benjamin Lee, whose credentials for authentication are:
    
      - username: **benlee**
      - password: **benlee**
    
    >*TIP*: see all Customers and their accounts on [My Sandbox](https://openbanking.api.tietoevry.com/workplace/sandbox) page.
    
    After authentication in the browser, you will be shown the consent data and all you need to do to confirm the consent is click CONFIRM button.
    
    After CONFIRM button is pressed the browser redirects to the URL that was used in TPP-Redirect-URI header during creation of this consent.   
    After the succesfull confirmation, go to the  Request Inspector web page.  and wait for the second scaRedirect link and copy it to the browser. This link will open an another authorization page that simulates SCA page of a bank, where PSU can authenticate himself and then confirm the consent.
    
    The Customer you use to authenticate and confirm the request to pay must be the owner of **iban** used in the body of **request to pay** call (see [Step 1](##Step-1:-Creating-a-request-to-pay)).
    
    For example, if the consent have been created with this account
    ```
      "account": { 
        "iban": "BANK06850389716643218" 
        …
      }
    ```
    
    Then the Customer who needs to confirm it is   Irene Price, whose credentials for authentication are:
    
      - username: **irepri**
      - password: **irepri**
    
    After authentication in the browser, you will be shown the request to pay data and all you need to do to confirm it by clicking CONFIRM button.
    
    After CONFIRM button is pressed the browser redirects to the URL that was used in TPP-Redirect-URI header during creation of this consent.       
    
    That’s it – the request to pay is confirmed.




