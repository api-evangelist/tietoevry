        explanation:
          type: string
    JsonGetFundsConfirmationConsentResponse_2:
      type: object
      required:
      - account
      - instructedAmount
      - combinedServiceIndicator
      - consentStatus
      - validUntil
      properties:
        cardNumber:
          type: string
        account:
          $ref: '#/components/schemas/JsonAccountReference_3'
        payee:
          type: string
        instructedAmount:
          $ref: '#/components/schemas/JsonAmount'
        validUntil:
          type: string
          format: date-time
        combinedServiceIndicator:
          type: boolean
          example: false
          description: Unsupported mandatory field. Must be set to false
        consentStatus:
          $ref: '#/components/schemas/ConsentStatus'
        _links:
          readOnly: true
          $ref: '#/components/schemas/JsonLinks'
        chosenScaMethod:
          $ref: '#/components/schemas/OtpChosenScaMethod'
        challengeData:
          $ref: '#/components/schemas/OtpChallengeData'
