components:
  schemas:
    JsonPostAuthorisationsResponse:
      type: object
      properties:
        psuMessage:
          type: string
        tppMessages:
          type: array
          items:
            $ref: '#/components/schemas/JsonMessage'
        scaStatus:
          type: string
        _links:
          readOnly: true
          $ref: '#/components/schemas/JsonLinks'
    JsonGetConsentStatusResponse:
      type: object
      properties:
        consentStatus:
          type: string
    JsonGetAuthorisationsResponse:
      type: object
      properties:
        authorisationsIds:
          type: array
          items:
            type: string
    TransactionStatus:
      type: string
      enum:
      - ACCC
      - ACCP
      - ACSC
      - ACSP
      - ACTC
      - ACWC
      - ACWP
      - RCVD
      - PDNG
      - RJCT
      - CANC
      - ACFC
      - PATC
      - PART
    JsonLinks:
      type: object
      properties:
        scaRedirect:
          $ref: '#/components/schemas/JsonHref'
        scaOAuth:
          $ref: '#/components/schemas/JsonHref'
        self:
          $ref: '#/components/schemas/JsonHref'
        status:
          $ref: '#/components/schemas/JsonHref'
        account:
          $ref: '#/components/schemas/JsonHref'
        balances:
          $ref: '#/components/schemas/JsonHref'
        transactions:
          $ref: '#/components/schemas/JsonHref'
        transactionDetails:
          $ref: '#/components/schemas/JsonHref'
        first:
          $ref: '#/components/schemas/JsonHref'
        next:
          $ref: '#/components/schemas/JsonHref'
        previous:
          $ref: '#/components/schemas/JsonHref'
        last:
          $ref: '#/components/schemas/JsonHref'
        download:
          $ref: '#/components/schemas/JsonHref'
        updatePsuIdentification:
          $ref: '#/components/schemas/JsonHref'
        startAuthorisation:
          $ref: '#/components/schemas/JsonHref'
        scaStatus:
          $ref: '#/components/schemas/JsonHref'
    JsonGetFundsConfirmationConsentResponse:
      type: object
      required:
      - account
      - instructedAmount
      - combinedServiceIndicator
      - consentStatus
      - validUntil
      properties:
        cardNumber:
          type: string
        account:
          $ref: '#/components/schemas/JsonAccountReference'
        payee:
          type: string
        instructedAmount:
          $ref: '#/components/schemas/JsonAmount'
        validUntil:
          type: string
          format: date-time
        combinedServiceIndicator:
          type: boolean
          example: false
        consentStatus:
          type: string
          enum:
          - received
          - rejected
          - valid
          - revokedByPsu
          - expired
          - terminatedByTpp
        _links:
          readOnly: true
          $ref: '#/components/schemas/JsonLinks'
    JsonGetAuthorisationStatusResponse:
      type: object
      properties:
        scaStatus:
          type: string
    JsonMessage:
      type: object
      required:
      - category
      - code
      properties:
        category:
          type: string
        code:
          type: string
        path:
          type: string
        text:
          type: string
    JsonPostFundsConfirmationConsentsRequest:
      type: object
      required:
      - account
      - combinedServiceIndicator
      - instructedAmount
      properties:
        cardNumber:
          type: string
        account:
          $ref: '#/components/schemas/JsonAccountReference'
        payee:
          type: string
        instructedAmount:
          $ref: '#/components/schemas/JsonAmount'
        combinedServiceIndicator:
          type: boolean
          example: true
    JsonErrorResponse:
      type: object
      required:
      - transactionStatus
      properties:
        psuMessage:
          type: string
        tppMessages:
          type: array
          items:
            $ref: '#/components/schemas/JsonMessage'
        transactionStatus:
          $ref: '#/components/schemas/TransactionStatus'
    JsonAccountReference:
      type: object
      required:
      - currency
      properties:
        iban:
          type: string
        bban:
          type: string
        pan:
          type: string
        maskedPan:
          type: string
        msisdn:
          type: string
        currency:
          type: string
      description: Must contain one of iban,bban,maskedPan,msisdn or pan field
    JsonHref:
      type: object
      properties:
        href:
          type: string
    JsonAmount:
      type: object
      required:
      - amount
      - currency
      properties:
        currency:
          type: string
        amount:
          type: string
    JsonErrorResponse_2:
      type: object
      required:
      - transactionStatus
      properties:
        psuMessage:
          type: string
        tppMessages:
          type: array
          items:
            $ref: '#/components/schemas/JsonMessage'
        transactionStatus:
          type: string
          enum:
          - AcceptedCustomerProfile
          - AcceptedSettlementCompleted
          - AcceptedSettlementInProcess
          - AcceptedTechnicalValidation
          - AcceptedWithChange
          - AcceptedWithoutPosting
          - Received
          - Pending
          - Rejected
    JsonAccountReference_2:
      type: object
      properties:
        iban:
          type: string
        bban:
          type: string
        pan:
          type: string
