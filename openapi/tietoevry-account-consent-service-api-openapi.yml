components:
  schemas:
    JsonPostAuthorisationsResponse:
      type: object
      properties:
        psuMessage:
          type: string
        authorisationId:
          type: string
        scaStatus:
          type: string
        _links:
          $ref: '#/components/schemas/JsonLinks'
    JsonGetConsentStatusResponse:
      type: object
      properties:
        consentStatus:
          type: string
    JsonAccountAccess:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/JsonAccountReference'
        balances:
          type: array
          items:
            $ref: '#/components/schemas/JsonAccountReference'
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/JsonAccountReference'
    JsonGetAuthorisationsResponse:
      type: object
      properties:
        authorisationIds:
          type: array
          items:
            type: string
    JsonLinks:
      type: object
      properties:
        scaRedirect:
          $ref: '#/components/schemas/JsonHref'
        scaOAuth:
          $ref: '#/components/schemas/JsonHref'
        self:
          $ref: '#/components/schemas/JsonHref'
        status:
          $ref: '#/components/schemas/JsonHref'
        account:
          $ref: '#/components/schemas/JsonHref'
        balances:
          $ref: '#/components/schemas/JsonHref'
        transactions:
          $ref: '#/components/schemas/JsonHref'
        transactionDetails:
          $ref: '#/components/schemas/JsonHref'
        first:
          $ref: '#/components/schemas/JsonHref'
        next:
          $ref: '#/components/schemas/JsonHref'
        previous:
          $ref: '#/components/schemas/JsonHref'
        last:
          $ref: '#/components/schemas/JsonHref'
        download:
          $ref: '#/components/schemas/JsonHref'
        updatePsuIdentification:
          $ref: '#/components/schemas/JsonHref'
        startAuthorisation:
          $ref: '#/components/schemas/JsonHref'
        scaStatus:
          $ref: '#/components/schemas/JsonHref'
    JsonGetAuthorisationStatusResponse:
      type: object
      properties:
        scaStatus:
          type: string
    JsonGetConsentResponse:
      type: object
      required:
      - access
      - combinedServiceIndicator
      - consentStatus
      - frequencyPerDay
      - recurringIndicator
      - validUntil
      properties:
        access:
          $ref: '#/components/schemas/JsonAccountAccess'
        recurringIndicator:
          type: boolean
        validUntil:
          type: string
        frequencyPerDay:
          type: string
        combinedServiceIndicator:
          type: boolean
          example: false
        consentStatus:
          type: string
          enum:
          - received
          - valid
          - blocked
          - expired
          - deleted
          - terminatedByTpp
        _links:
          $ref: '#/components/schemas/JsonLinks'
    JsonMessage:
      type: object
      required:
      - category
      - code
      properties:
        category:
          type: string
        code:
          type: string
        path:
          type: string
        text:
          type: string
    JsonPostConsentsResponse:
      type: object
      properties:
        psuMessage:
          type: string
        tppMessages:
          type: array
          items:
            $ref: '#/components/schemas/JsonMessage'
        consentId:
          type: string
          format: uuid
        consentStatus:
          type: string
        _links:
          $ref: '#/components/schemas/JsonLinks'
    JsonPostConsentsRequest:
      type: object
      required:
      - access
      - recurringIndicator
      - combinedServiceIndicator
      - frequencyPerDay
      - validUntil
      properties:
        access:
          $ref: '#/components/schemas/JsonAccountAccess'
        validUntil:
          type: string
        frequencyPerDay:
          type: string
        recurringIndicator:
          type: boolean
          example: true
