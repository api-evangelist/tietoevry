idempotency:
  supported: false
  grade: absent
  header: X-Request-ID
  header_required_on: 186 of 211 operations
  echoed_on: 38 responses
  provider_wording: 'X-Request-ID is described only as "a unique identifier in UUID format". Nothing in the
    contracts or the manual states that resending the same X-Request-ID replays a stored response, states a
    retention window, or names an Idempotency-Key header.'
  assessment: 'Treat X-Request-ID as a correlation and tracing identifier, not an idempotency key. Retrying a
    failed POST /payments is NOT safe from the public contract''s point of view — a client that resends after
    a timeout must first poll the payment status endpoint. This is the single largest runtime-semantics gap
    in the surface, because the API''s write operations move money.'
