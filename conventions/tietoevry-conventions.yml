  credit_rationale: 'Reversal paths are first-class, published operations with named reason codes, so this is
    not `absent`. It is not `verified` either: nowhere in the 24 contracts or the manual does Tietoevry state
    a TIME WINDOW for any reversal. The cancellation boundary is named only qualitatively — "not cancellable,
    e.g. due to cut off time passed" — with no cut-off time published, and the SEPA refund and chargeback
    operations state no deadline at all even though the SEPA rulebook imposes one. No window is asserted
    here, because inventing one is the error in this pipeline that could cost a user real money.'
