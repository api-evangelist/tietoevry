    library. npm returns one unrelated third-party result for "tietoevry"; PyPI has no tietoevry project
    (HTTP 404); no first-party package exists on RubyGems, NuGet, crates.io, Packagist or pkg.go.dev. The
    only first-party packages anywhere are three Maven Central artifacts of one open-source SERVER-side
    Quarkus extension, which does not wrap any Tietoevry API. Because no package here is an API client
    library, this repo deliberately does NOT emit a type: SDKs pointer — doing so would credit Tietoevry with
    an SDK surface it does not ship.'
