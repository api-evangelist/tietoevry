    url: https://openbanking.api.tietoevry.com/workplace/applications/sandbox
    detail: 'An application named "My Test App" is pre-created for every new account and works immediately.
      Creating your own lets you pin the API group version and restrict which API sets the app may reach.
      Fields collected: application name, description, API Group (choose XS2A for the PSD2-compliant APIs),
