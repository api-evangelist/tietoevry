- aid: tietoevry:tietoevry-financial-api-aggregation
  name: Tietoevry Financial API Aggregation
  description: A single-integration aggregation layer over Nordic and Baltic banks, exposing provider
    discovery, end-user management and aggregated XS2A operations (accounts, balances, transactions, consents,
    confirmation of funds and payment initiation) across many connected ASPSPs behind one contract, with
    a pre-step SCA service and aggregated consent creation.
  humanURL: https://aggregation.api.tieto.com/
  baseURL: https://aggregation.api.tieto.com
  tags:
  - Aggregation
  - Open Banking
  - XS2A
  - Multibanking
  - Nordic
  - Baltic
  properties:
  - type: OpenAPI
    url: openapi/tietoevry-financial-api-aggregation-swagger.json
  - type: Overlay
    url: overlays/tietoevry-financial-api-aggregation-swagger-overlay.yaml
  - type: Documentation
    url: https://aggregation.api.tieto.com/
- aid: tietoevry:tietoevry-sepa-direct-debits
  name: Tietoevry SEPA Direct Debits
  description: A SEPA Direct Debit gateway for Creditor and Debtor roles, allowing creditors to initiate
    payments, cancel (reverse) them and issue refunds, and debtors to reject payments and raise chargebacks,
    with an event-notification webhook mechanism that pushes state changes for payments, refunds and incoming
    collections to Creditor-Notification-URI and Debtor-Notification-URI endpoints.
  humanURL: https://openbanking.api.tietoevry.com/documentation/sepa-direct-debit
  baseURL: https://payments.api.tieto.com/live/v1/sepadd
  tags:
