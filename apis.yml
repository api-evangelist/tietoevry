aid: tietoevry
name: TietoEVRY
description: 'TietoEVRY (Tietoevry Corporation, listed as TIETO on Nasdaq Helsinki and Stockholm, rebranded
  to "Tieto" in 2026) is a Nordic software and technology company of roughly 14,000 people operating in
  20+ countries, serving banking, healthcare, public sector and industry. Its public API surface is published
  by the banking business (Tieto Banktech / Tietoevry Banking) through the Tietoevry Banking API Hub at
  api.tietoevry.com, which fronts three developer portals: an Open Banking PSD2/XS2A platform built on
  the Berlin Group NextGenPSD2 framework with a free self-service sandbox, a Financial API Aggregation
  service offering one integration to Nordic and Baltic banks, and a Credit Cloud platform for loan origination
  and loan life-cycle management. 24 machine-readable Swagger 2.0 / OpenAPI 3.0 contracts covering 211
  operations are published unauthenticated from the Open Banking and Aggregation portals, including account
  information, payment initiation, confirmation of funds, bulk and periodic payments, payment recall,
  request-to-pay, signing baskets, virtual account management, card account information and a SEPA Direct
  Debits gateway with a webhook event-notification surface.'
