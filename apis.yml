apis:
- aid: tietoevry:tietoevry-openbanking-xs2a
  name: Tietoevry Open Banking XS2A APIs
  description: PSD2-compliant Access to Account (XS2A) APIs implementing the Berlin Group NextGenPSD2
    framework, plus Tietoevry premium extensions beyond the PSD2 mandate. Covers account information (AIS),
    payment initiation (PIS), confirmation of funds (PIIS), bulk payments, future-dated and periodic payments,
    payment recall, request-to-pay and subscriptions to request-to-pay, signing baskets, card and card-account
    information, extended account owner details, and Virtual Account Management (VAM). Every endpoint
    shares one hostname and is selected by a sandbox|live path segment; a free self-service sandbox with
    simulated SCA and fake PSUs requires no eIDAS certificate.
  humanURL: https://openbanking.api.tietoevry.com/
  baseURL: https://openbanking.api.tietoevry.com
  tags:
  - Open Banking
  - PSD2
  - XS2A
  - Berlin Group
  - Account Information
  - Payment Initiation
  - Confirmation of Funds
  - Virtual Accounts
