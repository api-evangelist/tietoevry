  description: >-
    A credit platform used by banks and financial institutions in 20+ countries to manage virtually any
    type of credit, organised around loan origination, loan life cycle and collection. The developer portal
    is published but every API reference behind it sits behind a Keycloak sign-in, so no machine-readable
    contract and no base URL are publicly stated.
